<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <div class="card">
            <div class="card-inside">
                <div class="content">
                    <h3>To My Pakhi {AJMIRA}💖</h3>
                    <p>
                        তুমি আমার জীবনের এক অবিচ্ছিন্ন অদ্ধ্যায় পাখী । আমাকে কখনো ছেরে যেয়ো না পাখী ।
                        তোমাকে আমি অনেক অনেক এবং খুব ভালোবাসি আজমীরা ।  
                    </p>
                    <p class="wish">Always stay happy and stay by my side! 🌸</p>
                    <p class="signature">With all my love,<br><strong>YOUR MURAD</strong></p>
                </div>
            </div>

            <div class="card-cover">
                <div class="heart">❤️</div>
                <h2>Happy Special Day, My Love!</h2>
                <p>Hover / Tap to Open ✨</p>
            </div>
        </div>
    </div>

</body>
</html>
